apis:
- aid: shortcut:rest-api-v3
  name: Shortcut REST API v3
  description: >-
    RESTful API providing full CRUD access to stories, epics, iterations, milestones, workflows, projects,
    teams, members, files, labels, categories, and webhooks. Requests authenticate with a Shortcut-Token
    header containing an API token generated at app.shortcut.com settings, and are rate-limited to 200
    requests per minute.
